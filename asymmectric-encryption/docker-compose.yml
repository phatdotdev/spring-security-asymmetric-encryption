services:
  postgres:
    image: postgres:16-alpine
    container_name: spring_sec_asymmectric
    environment:
      POSTGRES_DB: spring_app_db
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: